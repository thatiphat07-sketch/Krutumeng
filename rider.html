<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Delivery App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
  </style>
</head>
<body class="text-gray-800">

  <script>
    // ⚠️ ใส่ URL เดียวกับหน้า Admin/Customer
    const API_URL = "https://script.google.com/macros/s/AKfycbxKOQ8oYYLfKzS65mcitVQ2h3IxfoWQ1YG1vUy0wdT04F2NdYl7tYy45YCFnsl4tm9K/exec";
  </script>

  <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-motorcycle text-xl"></i> ไรเดอร์ ระบบจัดส่ง
    </div>
    <button onclick="fetchJobs()" class="text-xs bg-white/20 px-3 py-1.5 rounded-lg"><i class="fa-solid fa-rotate"></i> รีเฟรช</button>
  </header>

  <main class="p-4 space-y-4 max-w-md mx-auto" id="jobs-container">
    <div class="text-center text-gray-500 py-10"><i class="fa-solid fa-spinner animate-spin text-2xl"></i><br>กำลังค้นหางานจัดส่ง...</div>
  </main>

  <!-- โมดอลยืนยันการจัดส่ง (ถ่ายรูป) -->
  <div id="delivery-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl">
      <div class="text-center font-bold text-lg text-blue-600 border-b pb-2">ยืนยันการจัดส่งอาหาร</div>
      <p class="text-xs text-gray-500 text-center">ออเดอร์: <span id="target-order-id" class="font-bold text-gray-800"></span></p>
      
      <div class="space-y-2">
        <label class="block text-sm font-bold text-gray-700"><i class="fa-solid fa-camera"></i> ถ่ายรูปหลักฐานการส่ง (วางอาหาร/หน้าบ้าน)</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="previewPhoto(event)" class="w-full text-sm text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        
        <div id="photo-preview-box" class="h-40 bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center overflow-hidden hidden">
          <img id="photo-preview-img" src="" class="w-full h-full object-cover">
        </div>
      </div>
      <textarea id="rider-note" rows="2" placeholder="โน้ตเพิ่มเติม (เช่น วางไว้บนโต๊ะหน้าบ้าน)" class="w-full p-2 border rounded-xl text-xs outline-none"></textarea>

      <div class="flex gap-2 pt-2">
        <button onclick="closeDeliveryModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl text-sm">ยกเลิก</button>
        <button onclick="submitDelivery()" id="btn-submit-delivery" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg text-sm transition disabled:opacity-50">ส่งงานเสร็จสิ้น</button>
      </div>
    </div>
  </div>

  <script>
    let photoBase64Data = "";
    let currentJobId = "";

    async function fetchJobs() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const orders = data.orders || [];
        
        // กรองเฉพาะงานที่ "กำลังขนส่ง" และ "จัดส่งถึงบ้าน"
        const deliveryJobs = orders.filter(o => o.status === 'กำลังขนส่ง' && o.type === 'จัดส่งถึงบ้าน');
        const container = document.getElementById('jobs-container');
        
        if (deliveryJobs.length === 0) {
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center shadow border text-gray-500"><i class="fa-solid fa-box-open text-4xl mb-2 text-gray-300"></i><br>ไม่มีงานจัดส่งในขณะนี้</div>`;
          return;
        }

        container.innerHTML = deliveryJobs.map(job => {
          let mapBtn = '';
          const mapMatch = (job.note || '').match(/(https:\/\/www\.google\.com\/maps\?q=[^\s|]+)/);
          if (mapMatch) mapBtn = `<a href="${mapMatch[0]}" target="_blank" class="w-full block text-center bg-green-100 text-green-700 font-bold py-2 rounded-xl text-xs mt-2 border border-green-200"><i class="fa-solid fa-map-location-dot"></i> เปิดนำทาง (Google Maps)</a>`;
          
          return `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-100 relative">
              <span class="absolute top-3 right-3 bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-1 rounded-lg">ยอดเก็บ: ฿${job.total}</span>
              <p class="font-bold text-blue-700">${job.id}</p>
              <p class="text-xs font-semibold text-gray-800 mt-1"><i class="fa-solid fa-user"></i> ${job.customer}</p>
              <p class="text-xs text-gray-500 mt-1 bg-gray-50 p-2 rounded-lg border"><strong>รายละเอียด/ที่อยู่:</strong> ${job.note || 'ไม่มีข้อมูล'}</p>
              ${mapBtn}
              <button onclick="openDeliveryModal('${job.id}')" class="w-full mt-2 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md text-sm"><i class="fa-solid fa-camera"></i> กดเพื่อส่งอาหาร & ถ่ายรูป</button>
            </div>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('jobs-container').innerHTML = `<div class="text-red-500 text-center py-4">โหลดข้อมูลล้มเหลว กรุณาลองใหม่</div>`;
      }
    }

    function openDeliveryModal(orderId) {
      currentJobId = orderId;
      document.getElementById('target-order-id').innerText = orderId;
      document.getElementById('delivery-modal').classList.remove('hidden');
      document.getElementById('photo-preview-box').classList.add('hidden');
      document.getElementById('camera-input').value = "";
      photoBase64Data = "";
    }

    function closeDeliveryModal() { document.getElementById('delivery-modal').classList.add('hidden'); }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        // บีบอัดรูปภาพด้วย Canvas ป้องกัน Base64 ใหญ่เกินไปจนส่ง API ไม่ผ่าน
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const max_size = 800;
            let w = img.width; let h = img.height;
            if (w > h) { if (w > max_size) { h *= max_size / w; w = max_size; } } 
            else { if (h > max_size) { w *= max_size / h; h = max_size; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            photoBase64Data = canvas.toDataURL('image/jpeg', 0.6); // บีบอัด 60%
            document.getElementById('photo-preview-img').src = photoBase64Data;
            document.getElementById('photo-preview-box').classList.remove('hidden');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    async function submitDelivery() {
      if (!photoBase64Data) return alert("กรุณาถ่ายรูปหรือเลือกรูปหลักฐานการจัดส่งก่อนครับ");
      const btn = document.getElementById('btn-submit-delivery');
      btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;

      try {
        await fetch(API_URL, {
          method: 'POST', mode: 'no-cors',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ 
            action: "updateStatus", 
            orderId: currentJobId, 
            status: "เสร็จสิ้น", // ปรับสถานะครัวเป็นเสร็จสิ้น
            photoBase64: photoBase64Data 
          })
        });
        alert('จัดส่งเรียบร้อยแล้ว!');
        closeDeliveryModal();
        fetchJobs();
      } catch(e) {
        alert('เกิดข้อผิดพลาดในการอัปโหลดรูป');
      } finally {
        btn.innerText = "ส่งงานเสร็จสิ้น"; btn.disabled = false;
      }
    }

    fetchJobs(); // โหลดครั้งแรก
  </script>
</body>
</html>
